{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SpecMetal Works</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


body{
    
    background:#f5f5f5;
}

/* LOADER */

#loader{

    position:fixed;
    width:100%;
    height:100vh;

    background:#111;

    color:#ff9800;

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:99999;

}


#loader h2{

    animation:pulse 1s infinite;

}


@keyframes pulse{

    50%{

        transform:scale(1.2);

    }

}




/* HEADER */

header h2{

    color:#ff9800;

}


header{

    background:#111;
    color:white;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px 80px;

    position:sticky;
    top:0;
    z-index:1000;

}



nav a{

    color:white;
    text-decoration:none;

    margin-left:25px;

    font-size:18px;

}


nav a:hover{

    color:#ff9800;

}






/* BUTTON */

.btn{

    display:inline-block;

    padding:15px 35px;

    background:#ff9800;

    color:white;

    text-decoration:none;

    border-radius:5px;

    font-size:18px;

}


.btn:hover{

    background:#d97706;

}



/* HERO */

.hero{

    height:90vh;

    background:

    linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),

    url("https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=1600");


    background-size:cover;

    background-position:center;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    color:white;

}



.hero h1{

    font-size:55px;

    margin-bottom:20px;

}



.hero p{

    font-size:20px;

    margin-bottom:30px;

}




/* SERVICES */


.services{

    padding:70px 10%;

    text-align:center;

}


.services h2{

    font-size:38px;

    margin-bottom:40px;

}



.cards{

    display:flex;

    justify-content:center;

    gap:30px;

    flex-wrap:wrap;

}



.card{

    background:white;

    width:300px;

    padding:30px;

    border-radius:10px;

    box-shadow:0 5px 15px rgba(0,0,0,.2);

}



.card h3{

    color:#ff9800;

    margin-bottom:15px;

}




/* ABOUT */


.about{

    background:#222;

    color:white;

    padding:70px;

    text-align:center;

}


.about h2{

    margin-bottom:20px;

}




/* CONTACT */


.contact{

    background:#ff9800;

    color:white;

    padding:70px;

    text-align:center;

}


.contact h2{

    font-size:35px;

    margin-bottom:20px;

}




/* WHATSAPP */


.whatsapp{

    position:fixed;

    bottom:20px;

    right:20px;

    width:60px;

    height:60px;

    background:#25D366;

    color:white;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:32px;

    text-decoration:none;

    box-shadow:0 4px 10px rgba(0,0,0,.3);

    z-index:9999;

}



.whatsapp:hover{

    transform:scale(1.1);

}
/* REVIEWS */

.reviews{

    padding:70px 10%;
    background:white;
    text-align:center;

}


.reviews h2{

    font-size:38px;
    margin-bottom:40px;

}



.review-cards{

    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;

}



.review-card{

    background:#f5f5f5;

    width:300px;

    padding:30px;

    border-radius:10px;

    box-shadow:0 5px 15px rgba(0,0,0,.2);

}



.review-card h3{

    color:#ff9800;

    margin-bottom:10px;

}



.stars{

    color:#ff9800;

    font-size:25px;

    margin:15px 0;

}



.review-card p{

    color:#555;

    line-height:1.6;

}



.rating{

    margin-top:40px;

    color:#ff9800;

    font-size:24px;

}


/* FOOTER */


footer{

    background:#111;

    color:white;

    text-align:center;

    padding:20px;

}




/* MOBILE */


@media(max-width:768px){


header{

    flex-direction:column;

}


nav{

    margin-top:15px;

}


nav a{

    display:block;

    margin:10px;

}


.hero h1{

    font-size:35px;

}


}


</style>


</head>

<body>

<div id="loader">
    <h2>SpecMetal Works</h2>
</div>


<header>

<h2>
SpecMetal Works
</h2>


<nav>

<a href="{% url 'home' %}">Home</a>
<a href="{% url 'about' %}">About</a>
<a href="{% url 'services' %}">Services</a>
<a href="{% url 'projects' %}">Projects</a>
<a href="{% url 'contact' %}">Contact</a>

</nav>

</header>


{% block content %}

{% endblock %}





<a href="https://wa.me/918547423559?text=Hello%20SpecMetal%20Works,%20I%20need%20a%20quotation."
class="whatsapp"
target="_blank">

<i class="fab fa-whatsapp"></i>

</a>





<footer>

© 2026 SpecMetal Works | All Rights Reserved

</footer>


<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>


<script>

AOS.init({

    duration:1000,

    once:true

});


window.onload=function(){

    document.getElementById("loader").style.display="none";

}

</script>


</body>

</html>
