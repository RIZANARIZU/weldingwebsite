{% extends 'style.html' %}

{% block title %}
Projects | SpecMetal Works
{% endblock %}


{% block content %}


<style>

.banner{

    background:#111;
    color:white;
    text-align:center;
    padding:50px;

}


.banner h1{

    font-size:40px;

}


.projects{

    padding:70px 8%;

}


.project-container{

    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;

}



.project-card{

    background:white;
    width:320px;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.2);

}



.project-card img{

    width:100%;
    height:220px;
    object-fit:cover;

}



.project-card h3{

    color:#ff9800;
    padding:15px;

}



.project-card p{

    padding:0 15px 20px;
    color:#555;
    line-height:1.6;

}


</style>



<section class="banner">

<h1>
Our Projects
</h1>

</section>




<section class="projects">


<div class="project-container">



{% for p in projects %}


<div class="project-card">


<img src="{{ p.image.url }}" alt="{{ p.title }}">


<h3>
{{ p.title }}
</h3>


<p>
{{ p.description }}
</p>


</div>



{% empty %}


<h2>
No Projects Added
</h2>


{% endfor %}



</div>


</section>



{% endblock %}
